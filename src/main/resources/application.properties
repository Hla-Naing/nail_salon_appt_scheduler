spring.application.name=nail-salon-appointment-scheduler
spring.datasource.url=${SALON_DB_URL:jdbc:postgresql://localhost:5432/nail_salon_db}
spring.datasource.username=${SALON_DB_USER:${USER}}
spring.datasource.password=${SALON_DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:seed.sql
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never

# Independent HTTP boundary; defaults to the mock controller in this application.
salon.notification.base-url=${NOTIFICATION_BASE_URL:http://localhost:8080}
salon.notification.connect-timeout-ms=${NOTIFICATION_CONNECT_TIMEOUT_MS:500}
salon.notification.response-timeout-ms=${NOTIFICATION_RESPONSE_TIMEOUT_MS:1000}
salon.notification.max-attempts=${NOTIFICATION_MAX_ATTEMPTS:3}
salon.notification.retry-delay-ms=${NOTIFICATION_RETRY_DELAY_MS:100}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.datasource.hikari.data-source-properties.socketTimeout=5
spring.jdbc.template.query-timeout=3
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
