<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Provider dashboard')}"></head><body>
<nav th:replace="~{fragments :: nav}"></nav><main class="container"><div th:replace="~{fragments :: notice}"></div><h1>Provider dashboard</h1><p>Manage your availability and appointments.</p><section class="card p-4 my-4"><h2 class="h4">Create availability</h2><form th:action="@{/web/provider/slots}" method="post" class="row g-3"><input type="hidden" name="csrfToken" th:value="${csrfToken}"><div class="col-md-3"><label for="service" class="form-label">Service</label><select id="service" name="serviceId" class="form-select" required><option th:each="s : ${services}" th:value="${s.id}" th:text="${s.name}"></option></select></div><div class="col-md-3"><label for="start" class="form-label">Start (Pacific)</label><input id="start" name="startAt" type="datetime-local" class="form-control" required></div><div class="col-md-3"><label for="end" class="form-label">End (Pacific)</label><input id="end" name="endAt" type="datetime-local" class="form-control" required></div><div class="col-md-3 align-self-end"><button class="btn btn-primary">Create slot</button></div></form></section>
<h2 class="h4">Your upcoming availability</h2><p th:if="${#lists.isEmpty(slots)}">No upcoming availability.</p><div class="table-responsive"><table class="table align-middle"><thead><tr><th>ID / service</th><th>Start / end (Pacific)</th><th>Availability</th><th>Action</th></tr></thead><tbody><tr th:each="s : ${slots}"><td><span th:text="${s.slotId}"></span> · <span th:text="${s.serviceName}"></span></td><td><span th:text="${@salonTime.display(s.startAt)}"></span><br><small th:text="${@salonTime.display(s.endAt)}"></small></td><td th:text="${s.booked ? 'Booked' : 'Available'}"></td><td><form th:unless="${s.booked}" th:action="@{/web/provider/slots/{id}/remove(id=${s.slotId})}" method="post"><input type="hidden" name="csrfToken" th:value="${csrfToken}"><button class="btn btn-outline-danger btn-sm">Remove</button></form></td></tr></tbody></table></div>
<h2 class="h4 mt-5">Your appointments and history</h2><p th:if="${#lists.isEmpty(appointments)}">No appointments yet.</p><div class="table-responsive"><table class="table"><thead><tr><th>ID</th><th>Customer</th><th>Service</th><th>Start / end (Pacific)</th><th>Status</th></tr></thead><tbody><tr th:each="a : ${appointments}"><td th:text="${a.appointmentId}"></td><td th:text="${a.customerName}"></td><td th:text="${a.serviceName}"></td><td><span th:text="${@salonTime.display(a.startAt)}"></span><br><small th:text="${@salonTime.display(a.endAt)}"></small></td><td th:text="${a.status}"></td></tr></tbody></table></div>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
