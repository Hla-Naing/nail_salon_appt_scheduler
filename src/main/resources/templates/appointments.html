<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('My appointments')}"></head><body>
<nav th:replace="~{fragments :: nav}"></nav><main class="container"><div th:replace="~{fragments :: notice}"></div><h1>My appointments</h1><p>Cancellations less than 5 hours before the start time incur a $10 fee. Appointments that have started cannot be cancelled.</p><p th:if="${#lists.isEmpty(appointments)}">You have no appointments yet. <a th:href="@{/web/slots}">Find a time</a>.</p><div class="table-responsive"><table class="table align-middle"><thead><tr><th>ID</th><th>Provider / service</th><th>Start / end (Pacific)</th><th>Status</th><th>Cancellation fee</th><th>Action</th></tr></thead><tbody><tr th:each="a : ${appointments}"><td th:text="${a.appointmentId}"></td><td><span th:text="${a.providerName}"></span><br><span th:text="${a.serviceName}"></span></td><td><span th:text="${@salonTime.display(a.startAt)}"></span><br><small th:text="${@salonTime.display(a.endAt)}"></small></td><td><span class="badge bg-secondary" th:text="${a.status}"></span></td><td th:text="${'$' + #numbers.formatDecimal(a.feeCharged,1,2)}"></td><td><form th:if="${a.status == 'BOOKED' and @salonTime.future(a.startAt)}" th:action="@{/web/appointments/{id}/cancel(id=${a.appointmentId})}" method="post" onsubmit="return confirm('Cancel this appointment? A $10 fee applies if it starts in less than 5 hours.');"><input type="hidden" name="csrfToken" th:value="${csrfToken}"><button class="btn btn-outline-danger btn-sm">Cancel</button></form></td></tr></tbody></table></div>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
