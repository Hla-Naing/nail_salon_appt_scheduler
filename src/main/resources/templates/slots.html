<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Available slots')}"></head><body>
<nav th:replace="~{fragments :: nav}"></nav><main class="container"><div th:replace="~{fragments :: notice}"></div><h1>Available appointments</h1><p class="text-secondary">Choose a service and a time that works for you.</p>
<form th:action="@{/web/slots}" method="get" class="row g-3 my-3"><div class="col-md-3"><label for="providerId" class="form-label">Provider</label><select id="providerId" name="providerId" class="form-select"><option value="">All providers</option><option th:each="p : ${providers}" th:value="${p.id}" th:text="${p.name}" th:selected="${p.id == providerId}"></option></select></div><div class="col-md-3"><label for="serviceId" class="form-label">Service</label><select id="serviceId" name="serviceId" class="form-select"><option value="">All services</option><option th:each="s : ${services}" th:value="${s.id}" th:text="${s.name}" th:selected="${s.id == serviceId}"></option></select></div><div class="col-md-3"><label for="date" class="form-label">Date (Pacific)</label><input id="date" name="date" type="date" th:value="${date}" class="form-control"></div><div class="col-md-3 align-self-end"><input type="hidden" name="size" th:value="${size}"><button class="btn btn-primary">Filter</button> <a th:href="@{/web/slots}">Reset</a></div></form>
<p th:if="${#lists.isEmpty(slots)}" class="alert alert-light">No available slots match these filters.</p>
<div class="table-responsive" th:unless="${#lists.isEmpty(slots)}"><table class="table align-middle"><thead><tr><th>Provider</th><th>Service</th><th>Price</th><th>Start / end (Pacific)</th><th>Booking</th></tr></thead><tbody><tr th:each="s : ${slots}"><td th:text="${s.providerName}"></td><td th:text="${s.serviceName}"></td><td th:text="${'$' + #numbers.formatDecimal(s.price,1,2)}"></td><td><span th:text="${@salonTime.display(s.startAt)}"></span><br><small th:text="${@salonTime.display(s.endAt)}"></small></td><td><form th:if="${viewer != null and viewer.role == 'CUSTOMER'}" th:action="@{/web/book}" method="post"><input type="hidden" name="csrfToken" th:value="${csrfToken}"><input type="hidden" name="slotId" th:value="${s.slotId}"><button class="btn btn-primary btn-sm">Book</button></form><a th:if="${viewer == null}" th:href="@{/web/login}">Login to book</a><span th:if="${viewer != null and viewer.role == 'PROVIDER'}">Customer booking</span></td></tr></tbody></table></div>
<nav aria-label="Slot pages" class="d-flex gap-3 align-items-center"><a class="btn btn-outline-secondary" th:if="${page > 0}" th:href="@{/web/slots(providerId=${providerId},serviceId=${serviceId},date=${date},page=${page - 1},size=${size})}">Previous</a><span th:text="${'Page ' + (page + 1L)}"></span><a class="btn btn-outline-secondary" th:if="${hasNext}" th:href="@{/web/slots(providerId=${providerId},serviceId=${serviceId},date=${date},page=${page + 1},size=${size})}">Next</a></nav>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
