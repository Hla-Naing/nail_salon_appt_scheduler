<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:fragment="head(title)">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${title} + ' | Nail Salon'">Nail Salon</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#fcf8f5;color:#322923}main{max-width:1100px}.navbar{background:#432b3a}.btn-primary{background:#754d66;border-color:#754d66}.card{border-color:#eaded9}th{white-space:nowrap} .hero{padding:4rem 0}a{color:#754d66}</style>
</head><body><nav th:fragment="nav" class="navbar navbar-dark px-4 py-3 mb-4"><a class="navbar-brand" th:href="@{/web}">Nail Salon</a>
<div class="d-flex gap-3 align-items-center flex-wrap"><a class="text-white" th:href="@{/web/slots}">Browse slots</a>
<a class="text-white" th:if="${viewer != null and viewer.role == 'CUSTOMER'}" th:href="@{/web/appointments}">My appointments</a>
<a class="text-white" th:if="${viewer != null and viewer.role == 'PROVIDER'}" th:href="@{/web/provider}">Provider dashboard</a>
<a class="text-white" th:if="${viewer == null}" th:href="@{/web/login}">Login</a>
<a class="text-white" th:if="${viewer == null}" th:href="@{/web/register}">Create Account</a>
<form th:if="${viewer != null}" th:action="@{/web/logout}" method="post"><input type="hidden" name="csrfToken" th:value="${csrfToken}"><button class="btn btn-sm btn-outline-light">Logout</button></form></div></nav>
<div th:fragment="notice" th:if="${message != null}" class="alert alert-info" role="status" th:text="${message}"></div>
<footer th:fragment="footer" class="container py-5 text-secondary"><small>All times are shown in America/Los_Angeles (Pacific time). CMPE 172 demo.</small></footer>
</body></html>
