<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Booking confirmation')}"></head><body>
<nav th:replace="~{fragments :: nav}"></nav><main class="container"><div th:replace="~{fragments :: notice}"></div><div class="card p-4"><h1>Your appointment</h1><p class="lead">Your booking is saved.</p><dl class="row"><dt class="col-sm-4">Appointment ID</dt><dd class="col-sm-8" th:text="${appointment.appointmentId}"></dd><dt class="col-sm-4">Provider</dt><dd class="col-sm-8" th:text="${appointment.providerName}"></dd><dt class="col-sm-4">Service</dt><dd class="col-sm-8" th:text="${appointment.serviceName}"></dd><dt class="col-sm-4">Start</dt><dd class="col-sm-8" th:text="${@salonTime.display(appointment.startAt)}"></dd><dt class="col-sm-4">End</dt><dd class="col-sm-8" th:text="${@salonTime.display(appointment.endAt)}"></dd><dt class="col-sm-4">Status</dt><dd class="col-sm-8" th:text="${appointment.status}"></dd></dl><a th:href="@{/web/appointments}">View all my appointments</a></div>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
