<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Login')}"></head><body>
<nav th:replace="~{fragments :: nav}"></nav><main class="container"><div th:replace="~{fragments :: notice}"></div><div class="card p-4 mx-auto" style="max-width:460px"><h1 class="h2">Welcome back</h1><p>Log in to manage your appointments.</p><form th:action="@{/web/login}" method="post"><input type="hidden" name="csrfToken" th:value="${csrfToken}"><label for="username" class="form-label">Username</label><input id="username" name="username" class="form-control mb-3" required maxlength="50" autocomplete="username"><label for="password" class="form-label">Password</label><input id="password" type="password" name="password" class="form-control mb-4" required maxlength="200" autocomplete="current-password"><button class="btn btn-primary w-100">Login</button></form></div>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
