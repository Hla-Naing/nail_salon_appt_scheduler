# Test classes must supply an isolated database URL; never fall back to development.
spring.datasource.url=jdbc:postgresql://127.0.0.1:1/not_configured
spring.sql.init.mode=always
spring.sql.init.data-locations=optional:classpath:no-demo-seed.sql
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=5000
logging.level.org.springframework=INFO
