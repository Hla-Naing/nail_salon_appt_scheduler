name: Java 21 build and PostgreSQL tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: salon_m2_test
          POSTGRES_USER: salon_test
          # Disposable CI service only; no stored credentials or external database.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salon_test -d salon_m2_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SALON_TEST_DB_URL: jdbc:postgresql://localhost:5432/salon_m2_test
      SALON_TEST_DB_USER: salon_test
      SALON_TEST_DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run all tests
        run: ./mvnw -B clean verify
      - name: Require real PostgreSQL integration tests
        run: |
          python3 - <<'PYTEST'
          import xml.etree.ElementTree as ET
          suite = ET.parse('target/surefire-reports/TEST-com.example.nail_salon_appt_scheduler.LocalPostgresTest.xml').getroot()
          assert int(suite.attrib['tests']) >= 16, suite.attrib
          assert int(suite.attrib['skipped']) == 0, suite.attrib
          assert int(suite.attrib['errors']) + int(suite.attrib['failures']) == 0, suite.attrib
          PYTEST
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results
          path: target/surefire-reports/
